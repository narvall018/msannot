name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint et typage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests app scripts
      - run: ruff format --check src tests app scripts
      - run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[app,dev,ref]"
      - run: pytest --cov=msannot --cov-report=term --cov-report=xml
      - if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  demo:
    name: Démonstration de bout en bout
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install --no-deps -e .
      - run: cd data/demo && sha256sum --check SHA256SUMS
      - run: msannot validate data/demo/massbank_open.msp.gz
      - run: msannot demo
      - run: msannot search data/demo/example_queries.mgf --library data/demo/massbank_open.msp.gz -o results/search
      - name: Rapport HTML et résultats
        uses: actions/upload-artifact@v7
        with:
          name: demo-results
          path: results/

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t msannot:ci .
      - run: docker run --rm msannot:ci --version
      - run: docker run --rm msannot:ci
